services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-talkrad_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD must be provided for staging}
      POSTGRES_DB: ${DB_NAME:-talkrad_messaging}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-talkrad_admin} -d ${DB_NAME:-talkrad_messaging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: postgres://${DB_USER:-talkrad_admin}:${DB_PASSWORD:?Error: DB_PASSWORD must be provided for staging}@postgres:5432/${DB_NAME:-talkrad_messaging}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be provided for staging}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Error: ENCRYPTION_KEY must be provided for staging}
      PROVIDER_MODE: ${PROVIDER_MODE:-live}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.yourdomain.com}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v22.0}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?Error: META_VERIFY_TOKEN must be provided for staging}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel for secure public HTTPS ingress (Webhook & API) with zero open inbound ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  postgres_staging_data:
