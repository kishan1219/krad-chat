[build]
  base = "frontend"
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  FAST_REFRESH = "false"
  DISABLE_ESLINT_PLUGIN = "true"
  NPM_FLAGS = "--legacy-peer-deps --include=dev"
  GENERATE_SOURCEMAP = "false"
  CI = "false"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "META_GRAPH_VERSION,PORT,PROVIDER_MODE,ADMIN_EMAIL,ADMIN_PASSWORD,DATABASE_URL,ENCRYPTION_KEY,JWT_SECRET,META_APP_ID,META_VERIFY_TOKEN,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_JWKS_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_SECRET_KEY,SUPABASE_URL,WORKER_ENABLED,REACT_APP_API_BASE_URL,REACT_APP_API_URL,REACT_APP_ASSET_URL,REACT_APP_ENABLE_FAKE_DB,REACT_APP_META_APP_ID,REACT_APP_META_CONFIG_ID,REACT_APP_META_GRAPH_VERSION,REACT_APP_WS_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,frontend/.env.example,backend/.env.example,public/index.html,public/manifest.json,src/assets/**,src/@core/assets/**,src/@fake-db/**"
  REACT_APP_API_URL = "https://krad-chat.onrender.com/api/"
  REACT_APP_ASSET_URL = "https://krad-chat.onrender.com/"
  REACT_APP_WS_URL = "wss://krad-chat.onrender.com/ws"
  REACT_APP_META_APP_ID = "2586815651799575"
  REACT_APP_META_GRAPH_VERSION = "v22.0"
  REACT_APP_ENABLE_FAKE_DB = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
