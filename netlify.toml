[build]
  base = "frontend"
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  FAST_REFRESH = "false"
  DISABLE_ESLINT_PLUGIN = "true"
  NPM_FLAGS = "--legacy-peer-deps --include=dev"
  GENERATE_SOURCEMAP = "false"
  CI = "false"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "META_GRAPH_VERSION,PORT,PROVIDER_MODE,ADMIN_EMAIL,ADMIN_PASSWORD,DATABASE_URL,ENCRYPTION_KEY,JWT_SECRET,META_APP_ID,META_VERIFY_TOKEN,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_JWKS_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_SECRET_KEY,SUPABASE_URL,WORKER_ENABLED,REACT_APP_API_BASE_URL,REACT_APP_API_URL,REACT_APP_ASSET_URL,REACT_APP_ENABLE_FAKE_DB,REACT_APP_META_APP_ID,REACT_APP_META_CONFIG_ID,REACT_APP_META_GRAPH_VERSION,REACT_APP_WS_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,frontend/.env.example,backend/.env.example,public/index.html,public/manifest.json,src/assets/**,src/@core/assets/**,src/@fake-db/**"
  REACT_APP_API_URL = "https://krad-chat.onrender.com/api/"
  REACT_APP_ASSET_URL = "https://krad-chat.onrender.com/"
  REACT_APP_WS_URL = "wss://krad-chat.onrender.com/ws"
  REACT_APP_META_APP_ID = "2586815651799575"
  REACT_APP_META_GRAPH_VERSION = "v22.0"
  REACT_APP_ENABLE_FAKE_DB = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://krad-chat.onrender.com wss://krad-chat.onrender.com https://graph.facebook.com https://*.facebook.com; frame-src https://www.facebook.com https://web.facebook.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self';"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

